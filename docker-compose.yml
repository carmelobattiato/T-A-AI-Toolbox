services:
  # ==========================================
  # 1. Backend + Database Container
  # ==========================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: ta-toolbox-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DATA_DIR=/app/data
      - NODE_ENV=production
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      # Persistent storage on host: changes to db.json and settings.json are permanently kept
      - ./data:/app/data

  # ==========================================
  # 2. Frontend Container (Nginx Reverse Proxy)
  # ==========================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: ta-toolbox-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
